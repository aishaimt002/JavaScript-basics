<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Operator</title>
</head>
<body>
    <script>
        alert(2 > 1); //true 
        alert( 2 == 1); //false
        alert( 2 != 1); //true 

        let result = 5 > 4; //true 
        alert(result); //true 

        alert('Z' > 'A'); //true 
        alert('Glow' > 'Glee'); //true 
        alert('Bee' > 'Be'); //true 

        alert('2' > 1); //true 
        alert('01' == 1); //true 
        alert(true == 1); //true 
        alert(false == 0); //true 

        //strict equality 
        alert( 0 === false); //false
        alert( null === undefined); //false
        alert(null == undefined); //true 

        alert(null > 0); //false
        alert(null == 0); //false
        alert(null >= 0); //true 

        alert( undefined < 0); //false
        alert(undefined == 0); //false
        alert(undefined >= 0); //false 

        

    </script>
    
</body>
</html>
