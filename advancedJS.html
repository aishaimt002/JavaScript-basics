    <script>
        //async programming 
        //One by one execution of task
        console.log("One");
        console.log("Two");
        console.log("Three");

        //Due to sync programming, sometimes imp instructions get blocked due to some previous instructions.
        //async code execution allows to execute next instructions immediatley and 
        //doesn't book the flow 
        function hello(){
            console.log("hello");
        }
        setTimeout(hello, 2000); 

        //this is called asynchronous programming 
        console.log("1");
        console.log("2");

        setTimeout(() => {
            console.log("I am learning JS");
        }, 5000); //after 5 second
        console.log("3");
        console.log("4");

        //a callback function: passed as n argument in another function
        function sumCallBack(a,b){
            console.log(a + b);
        }
        function calculator(a,b,sumCallBack){
            sumCallBack(a,b);
        }
        calculator(1,2,sumCallBack);

        //promises -> came to resolve the issues cause by callback hell
        // let promise = new Promise((resolve, reject) => {
        //  console.log("I am a promise");
        // // resolve("Promise is resolved");
        // rejected("Promise is rejected");
        // })

        //promise - pending, fullfilled, rejected 
        function getData(dataId, nextData){
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    console.log("Data", dataId);
                    resolve("success");
                    if(nextData){
                        nextData();
                    }
                }, 5000);
            })
        }

        //if resolved then use then or if rejected then error 
        const getPromise = () => {
            return new Promise((resolve, reject) => {
                console.log("Promise data");
                resolve("Success");
                //rejected("error");
            });
        };

        let promise = getPromise();
        promise.then((res) => {
            console.log("promise fullfilled", res);
        });

        promise.catch((err) => {
            console.log("rejected", err);
        });

        //promises chain 
        function asyncFunction1(){
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    console.log("data1");
                    resolve("success");
                }, 4000);
            });
        }

        function asyncFunction2(){
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    console.log("data2");
                    resolve("success");
                }, 4000);
            })
        }

        console.log("fetching data 1....");
        let p1 = asyncFunction1();
        p1.then((res) => {
            console.log("Fetching data2 ...");
            let p2 = asyncFunction2();
            p2.then((res) => {
                console.log("End function")
            })
        })

        //async await 
        async function hello(){
            console.log("hello async function");
        }

        //await pauses the execution of its surrounding async function until the promise is settled.
        function api(){
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    console.log("Weather data");
                    resolve(200);
                }, 2000);
            })
        }

        async function getWeatherData(){
            await api();
        }
