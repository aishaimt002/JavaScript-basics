<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statement</title>
</head>
<body>
    
    <script>
        let a = 2 + 2; 
        switch(a){
            case 3: 
            alert('Too small');
            break;
            case 4:
            alert('Exactly');
            break;
            case 5:
            alert('Too big');
            break;
            default: 
            alert("I don't know such values");
        }

        let c = "1";
        let d = 0;
        switch(+c){
            case d + 1: 
            alert("This runs, because +c is 1, exactly equals d+1");
            break;

            default: 
            alert("this doesn't run");
        }
        
        let value1 = 3;
        switch(value1){
            case 4:
            alert('Right!'); 
            break;

            case 3:
            case 5: 
            alert('wrong!');
            alert("Why don't you take a math class?");
            break;

            default: 
            alert('The result is strange.Really');
        }

        let myswitchValue = 'edge'; 
        if(myswitchValue == 'edge'){
            alert("You've got the edge!");
        }
        else if(myswitchValue == 'Chrome' || myswitchValue == 'Firefox' || myswitchValue == 'Safari' || myswitchValue == 'Opera'){
            alert("Okay we support these browsers too");
        }
        else{
            alert("We hope that this page looks ok!");
        }

        let mycurrentValue = +prompt('a?', '');
        switch(mycurrentValue){
            case 0:
            alert(0);
            break;
            case 1:
            alert(1);
            break;
            case 2:
            case 3:
                alert('2,3');
        }
        //use strict allow to enable the advance way of code if we didn't implemented the 
        //classes, objects, modules etc
        //add use strict at the top of the code 
        //inorder to enable the use strict make sure to add shift + enter in the developer console 

        
    </script>
</body>
</html>
