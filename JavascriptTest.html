            }

        //Question 09
        // Write a function capitalizeWords(str) that capitalizes the first 
        // character of every word in a sentence. For example, "hello javascript world" 
        // should become "Hello Javascript World".

        function capitalizeWords(str) {
            if (!str) {
                return str;
            }
            let words = str.split(" ");
            for (let i = 0; i < words.length; i++) {
                let result;
                result = words[i][0].toUpperCase() + words[i].slice(1);
                console.log(result);
            }
        }
        capitalizeWords("hello javascript world");

        //Question 11
        // Write a function removeDuplicates(arr) that returns a new array containing
        // only unique values, without modifying the original array.

        function removeDuplicate(arr) {
            let duplicateArray = [];
            for (let i = 0; i < arr.length; i++) {
                let count = 0;
                for (let j = 0; j < arr.length; j++) {
                    if (arr[i] === arr[j]) {
                        count++;
                    }
                }
                if (count > 1 && !duplicateArray.includes(arr[i])) {
                    duplicateArray.push(arr[i]);
                }
            }
            console.log("Duplicate elements are:", duplicateArray);
        }
